<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team showcase · Open Payments Innovation Lab</title>
<meta name="description" content="A team's open-payments prototype from the AUC Open Payments Innovation Lab: what they built, the pitch, the prototype and the people behind it.">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#04123a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/build-mode.css?v=72061ff384">
<script>document.documentElement.classList.add('js')</script>
<style>
/* the page: a navy hero (cover picture when the team has one), then white sections. One gold action: the prototype. */
.st-hero{position:relative;background:var(--navy);color:#9fb0d4;padding-block:clamp(56px,7vw,110px);overflow:hidden;isolation:isolate}
.st-hero .cover{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:.38}
.st-hero .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,18,58,.35),rgba(4,18,58,.95))}
.st-hero .kicker{color:#a8bcf5}
.st-hero .kicker a{color:inherit;text-decoration:none}
.st-hero h1{color:#fff;font-size:clamp(34px,4.8vw,66px);max-width:16ch;margin-top:14px;letter-spacing:-.01em}
.st-hero .sch{margin-top:8px;font-size:14px;color:#c9d4f0;font-weight:600}
.st-hero .tag{margin-top:18px;font-size:clamp(17px,1.6vw,21px);max-width:44ch;color:#dfe6fb;line-height:1.5}
.st-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(28px,4vw,56px);padding-block:clamp(40px,5vw,72px)}
.st-main{display:grid;gap:clamp(28px,3.4vw,44px);min-width:0}
.st-side{display:grid;gap:22px;align-content:start}
.st-sec h2{font-size:clamp(20px,2.2vw,26px);margin-bottom:12px}
.st-sec p{font-size:16px;line-height:1.65;color:var(--ink-2);max-width:66ch;margin:0 0 12px}
.st-video{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#04123a;border:1px solid var(--hair)}
.st-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.st-card{background:#fff;border:1px solid var(--hair);border-radius:18px;padding:22px;box-shadow:var(--shadow-sm)}
.st-card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.st-proto{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:999px;background:var(--gold);color:var(--navy);font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 10px 22px -12px rgba(253,201,33,.8)}
.st-proto:hover{background:var(--gold-deep)}
.st-proto .u{display:block;font-weight:400;font-size:12px;opacity:.75;overflow-wrap:anywhere}
.st-link{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--hair);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none}
.st-people{display:grid;gap:10px}
.st-person{display:flex;gap:12px;align-items:center;min-height:44px}
.st-person .av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.st-person b{display:block;font-size:14.5px;color:var(--ink)}
.st-person span{font-size:12px;color:var(--muted)}
.st-files{display:grid;gap:8px}
.st-file{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px;min-height:48px;padding:8px 0;border-top:1px solid var(--hair-soft);font-size:14px;color:var(--ink)}
.st-file:first-child{border-top:0}
.st-file a{color:var(--blue);font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.st-file .quiet{color:var(--muted);font-size:12.5px}
.st-empty{text-align:center;padding:clamp(48px,7vw,100px) 20px;color:var(--muted)}
.st-empty b{display:block;font-family:var(--display);font-size:clamp(22px,2.6vw,30px);color:var(--ink);margin-bottom:12px}
.st-empty a{color:var(--blue);font-weight:600}
.st-foot{padding-block:24px clamp(40px,5vw,72px);font-size:13.5px;color:var(--muted)}
.st-foot a{color:var(--blue);font-weight:600}
@media (max-width:860px){.st-body{grid-template-columns:1fr}}
</style>
</head><body>
<header class="site-header"><div class="wrap"><div class="bar">
<a class="brand" href="/"><img class="logo" src="/assets/logo-nav.webp" alt="" width="40" height="40" decoding="async"><span class="mark">Taylormade Academy</span></a>
<div class="nav-cta"><a class="btn sm" href="/opil/showcase/">Every team <span class="arr">&rarr;</span></a></div>
</div></div></header>

<main id="page">
<section class="st-hero"><div class="wrap">
<span class="kicker gold"><a href="/opil/showcase/">Open Payments Innovation Lab &middot; 2026&ndash;27</a></span>
<h1>Loading this team&rsquo;s page&hellip;</h1>
</div></section>
</main>

<script src="/js/config.js?v=72061ff384"></script>
<script type="module">
/* the cache stamp: whatever build_site.py stamped on config.js above, so a rebuild moves this module too
   (sw.js is cache-first on a ?v= asset — a pinned stamp would serve the first version forever) */
const V = (() => { try { const m = /\?v=[a-z0-9]+$/.exec(document.querySelector('script[src^="/js/config.js?v=72061ff384"]').getAttribute('src')); return m ? m[0] : ''; } catch (e) { return ''; } })();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const page = document.getElementById('page');
const H = await import('/js/rtk-showcase.js?v=72061ff384' + V);

function shell(inner) { page.innerHTML = inner; window.scrollTo(0, 0); }
function hero({ name, school, tagline, cover }) {
  return `<section class="st-hero">${cover ? '<div class="cover"></div>' : ''}<div class="wrap">
    <span class="kicker gold"><a href="/opil/showcase/">Open Payments Innovation Lab &middot; 2026&ndash;27</a></span>
    <h1>${esc(name)}</h1>
    ${school ? `<div class="sch">${esc(school)}</div>` : ''}
    ${tagline ? `<p class="tag">${esc(tagline)}</p>` : ''}
  </div></section>`;
}
function problem(title, line, cta) {
  shell(`<section class="st-hero"><div class="wrap"><span class="kicker gold"><a href="/opil/showcase/">Open Payments Innovation Lab &middot; 2026&ndash;27</a></span><h1>${esc(title)}</h1></div></section>
    <div class="wrap"><div class="st-empty"><b>${esc(line)}</b>${cta}</div></div>`);
  document.title = title + ' · Open Payments Innovation Lab';
}

const slug = H.slugFromQuery(location.search);
if (!slug) {
  problem('Which team?', 'This link is missing the team’s name.', '<a href="/opil/showcase/">See every published team &rarr;</a>');
} else {
  try {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const sb = createClient(window.BM_CONFIG.SUPABASE_URL, window.BM_CONFIG.SUPABASE_KEY);
    const { data: t, error } = await sb.from('ea_opil_showcase_team').select('*').eq('slug', slug).maybeSingle();
    if (error) throw error;
    if (!t) {
      problem('Not published yet', 'This team hasn’t published its page, or the link is a little off.', '<a href="/opil/showcase/">See every published team &rarr;</a>');
    } else {
      const cover = H.coverUrl(window.BM_CONFIG.SUPABASE_URL, t.cover_path);
      const embed = H.embedFor(t.video_url);
      const files = H.fileRows(t.files);
      const members = Array.isArray(t.members) ? t.members : [];
      document.title = t.name + ' · Open Payments Innovation Lab';
      shell(hero({ name: t.name, school: t.school, tagline: t.tagline, cover }) + `
      <div class="wrap"><div class="st-body">
        <div class="st-main">
          ${t.video_url ? `<section class="st-sec"><h2>The pitch</h2>${embed
            ? `<div class="st-video"><iframe src="${esc(embed.src)}" title="${esc(t.name)} — the pitch" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`
            : `<p>The pitch video lives on another site.</p><a class="st-link" href="${esc(t.video_url)}" target="_blank" rel="noopener">Watch the pitch &rarr;</a>`}</section>` : ''}
          <section class="st-sec"><h2>What ${esc(t.name)} built</h2>${t.project ? H.paragraphs(t.project, esc) : '<p>The team hasn’t written this part yet. Check back soon.</p>'}</section>
          ${files.length ? `<section class="st-sec"><h2>Files and links</h2><div class="st-card"><div class="st-files">${files.map(f => `<div class="st-file"><span>${esc(f.title)}</span><a href="${esc(f.url)}" target="_blank" rel="noopener">Open &rarr;</a></div>`).join('')}</div></div></section>` : ''}
        </div>
        <aside class="st-side">
          ${t.prototype_url ? `<div class="st-card"><h3>The prototype</h3><a class="st-proto" href="${esc(t.prototype_url)}" target="_blank" rel="noopener"><span>Try the prototype &rarr;</span></a><p style="margin:10px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere">${esc(t.prototype_url)}</p></div>` : ''}
          <div class="st-card"><h3>The team</h3>${members.length
            ? `<div class="st-people">${members.map(m => `<div class="st-person"><span class="av">${esc(String(m.name || 'T')[0].toUpperCase())}</span><div><b>${esc(m.name || 'Team member')}</b><span>${m.role === 'lead' ? 'Team lead' : 'Team member'}</span></div></div>`).join('')}</div>`
            : '<p style="margin:0;font-size:14px;color:var(--muted)">The team’s names aren’t listed yet.</p>'}</div>
          ${t.school ? `<div class="st-card"><h3>School</h3><p style="margin:0;font-size:15px;color:var(--ink)">${esc(t.school)}</p></div>` : ''}
        </aside>
      </div>
      <div class="st-foot">Built in the AUC Open Payments Innovation Lab, 2026&ndash;27. <a href="/opil/showcase/">See every published team &rarr;</a></div></div>`);
      /* the cover goes in through the style property, never a template string: coverUrl() only ever returns a
         URL made of [a-z0-9._-/] plus the bucket host, and JSON.stringify quotes it for url() regardless */
      const cv = page.querySelector('.st-hero .cover'); if (cv && cover) cv.style.backgroundImage = 'url(' + JSON.stringify(cover) + ')';
    }
  } catch (e) {
    console.warn('[showcase]', e);
    problem('One moment', 'Couldn’t load this page right now.', '<button type="button" class="st-link" onclick="location.reload()">Try again</button> <a class="st-link" href="/opil/showcase/">See every published team &rarr;</a>');
  }
}
</script>
</body></html>

<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">

<script>document.documentElement.classList.add('js')</script>
<style>
.live-grid{display:grid;grid-template-columns:1fr 340px;gap:clamp(18px,2.6vw,30px);align-items:start;padding-bottom:60px}
@media(max-width:900px){.live-grid{grid-template-columns:1fr}}
.player{background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--hair);box-shadow:var(--shadow-card);aspect-ratio:16/9;position:relative}
.player iframe,.player video{width:100%;height:100%;border:0;display:block;background:#000}
.player .brandbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(rgba(4,18,58,.75),transparent);z-index:5;pointer-events:none;opacity:1;transition:opacity .4s ease}
.player.playing .brandbar{opacity:0}
.player:hover .brandbar{opacity:1}
.player .brandbar img{width:26px;height:26px}
.player .brandbar b{font-family:var(--display);font-weight:600;color:#fff;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.player .brandbar .lv{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:rgba(16,185,129,.18);border:1px solid rgba(16,185,129,.5);color:#7ce8c3;font-weight:700;font-size:11.5px;letter-spacing:.08em;padding:5px 12px;border-radius:980px}
.player .brandbar .lv i{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 1.6s ease-in-out infinite}
.player .wm{position:absolute;right:16px;bottom:72px;z-index:5;pointer-events:none;opacity:.5}
.player .wm img{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.player .idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9fb0d4;background:var(--navy);text-align:center;padding:20px}
.player .idle b{font-family:var(--display);color:#fff;font-size:clamp(18px,2.2vw,26px)}
.livebadge{display:inline-flex;align-items:center;gap:8px;background:#e8f8f0;color:#067a56;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:980px}
.livebadge i{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.livebadge i{animation:none}}
.chat input:disabled,.chat button:disabled{opacity:.55;cursor:not-allowed}
.chat .note{align-self:center;font-size:12.5px;font-weight:600;color:#b4451f;background:#fdf0e7;border-radius:980px;padding:6px 12px}
/* broadcast control (program team only) */
#bc .hcard{margin-bottom:22px}
.bc-ctl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bc-ctl-row+.bc-ctl-row{margin-top:9px}
.bc-ctl-row select,.bc-ctl-row input{flex:1;min-width:0;font:inherit;font-size:13.5px;padding:9px 13px;border:1.5px solid var(--hair);border-radius:10px;background:#fff;color:var(--ink)}
.bc-ctl-row input{min-width:220px}
#bcNote{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
#bc select:disabled,#bc input:disabled,#bc .pillbtn:disabled{opacity:.55;cursor:not-allowed}
</style>
</head><body>
<header class="site-header"><div class="wrap"><div class="bar">
<a class="brand" href="/"><img class="logo" src="/assets/logo-nav.webp" alt="" width="40" height="40" decoding="async"><span class="mark">Taylormade Academy</span></a>
<div class="nav-cta"><span class="mono" style="color:var(--muted)">OPIL LAB HUB · 2026–27</span></div>
</div></div></header>

<main class="hub-wrap">
<div class="hub-head">
<div><span class="kicker gold">Live session</span><h1 id="ttl" style="margin-top:10px">The live room</h1></div>
<span class="livebadge" id="badge" style="display:none"><i></i>LIVE NOW</span>
</div>
<div class="hub-tabs"></div>
<div id="bc"></div>

<div class="live-grid">
<div>
<div class="player" id="player">
<div class="idle" id="idle"><b>Nothing is streaming right now.</b><span>When a session goes live, the stream appears here and everyone sees the banner on their hub home.</span></div>
</div>
<p id="meta" style="font-size:14px;color:var(--muted);margin-top:14px"></p>
</div>
<div class="hcard chat" style="height:560px">
<div class="hd2"><h2>Room chat</h2><span class="mono" style="font-size:11px;color:var(--emerald)">COHORT ONLY</span></div>
<div class="scroll" id="lcScroll"><div class="empty">Say what you&rsquo;re seeing. The whole cohort is in here.</div></div>
<form id="lcForm"><input id="lcInput" placeholder="Message the room" maxlength="1000" autocomplete="off"><button type="submit" id="lcSend">Send</button></form>
</div>
</div>
</main>

<script src="/js/config.js?v=ab90329eb6"></script>
<script type="module">
import { boot, names, esc, when, nav } from '/opil/hub/hub.js?v=ab90329eb6';
import { play, panelHTML, wirePanel } from '/js/broadcast.js?v=ab90329eb6';
const ctx = await boot(); if (!ctx) throw new Error('gate');
const { sb, user, isAdmin, facSessions } = ctx;
const staff = isAdmin || (facSessions || []).length > 0;   /* coordinators and facilitators get the Broadcast control */
nav(ctx, 'live');

/* find the live session */
const { data: liveSess } = await sb.from('ea_opil_sessions').select('*').eq('is_live', true).order('no').limit(1).maybeSingle();
let sessionNo = liveSess ? liveSess.no : null;

function safeUrl(u) {
  let url; try { url = new URL(u); } catch (e) { return null; }
  return url.protocol === 'https:' ? url : null;   /* no javascript:, data:, http: */
}
function embedUrl(u) {
  const url = safeUrl(u); if (!url) return null;
  const host = url.hostname.toLowerCase();
  const yt = (id) => 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1';
  if (host === 'youtube.com' || host === 'www.youtube.com') {
    if (url.searchParams.get('v')) return yt(url.searchParams.get('v'));
    if (url.pathname.startsWith('/live/')) return yt(url.pathname.split('/')[2] || '');
  }
  if (host === 'youtu.be') return yt(url.pathname.slice(1));
  return url.href; /* already an embeddable player URL (Mux, Vimeo, etc.) */
}
function playerFail(player, msg) {
  player.querySelectorAll('video,iframe,.brandbar,.wm').forEach(el => el.remove());
  player.classList.remove('playing');
  const d = document.createElement('div');
  d.className = 'idle';
  d.innerHTML = '<b>This stream will not play here.</b><span>' + msg + '</span>';
  player.appendChild(d);
}
function brandChrome(player, title) {
  const bar = document.createElement('div');
  bar.className = 'brandbar';
  bar.innerHTML = `<img src="/assets/logo-nav.webp" alt=""><b>Taylormade Academy Live · ${title.replace(/</g,'&lt;')}</b><span class="lv"><i></i>LIVE</span>`;
  player.appendChild(bar);
  const wm = document.createElement('div');
  wm.className = 'wm'; wm.innerHTML = '<img src="/assets/logo-nav.webp" alt="">';
  player.appendChild(wm);
}
const DEMO_URL = '/assets/live-demo/stream.m3u8';
const IDLE_HTML = document.getElementById('player').innerHTML;   /* kept verbatim so a broadcaster can put it back on End */
let selfBroadcast = false;   /* this page is the broadcaster: it watches its own feed muted (or hears itself a beat late) and the wake poll must not reload it */
let unmount = null;          /* stops whatever mountStream started (WebRTC retries, hls.js) before the player is cleared */
/* same label rule as the hub: AI Thread 01-14, curriculum S1-S8 (201+), HPC H1-H4 (301+) */
const sessLabel = s => s.kind === 'curriculum' ? 'S' + (s.no % 100) : s.kind === 'hpc' ? 'H' + (s.no % 100) : String(s.no).padStart(2, '0');
const metaLine = (s) => 'Session ' + sessLabel(s) + (s.outcome ? ' · Today you leave with: ' + s.outcome : '');
async function mountStream(u, title) {
  const player = document.getElementById('player');
  const isDemo = (u === DEMO_URL);
  const abs = isDemo ? new URL(u, location.origin).href : (safeUrl(u) ? u : null);
  if (!abs) { playerFail(player, 'That playback link is not a secure https address.'); return; }
  const idle = document.getElementById('idle'); if (idle) idle.remove();
  if (/\/webRTC\/play(\?|$)/i.test(abs)) {
    /* a browser broadcast: watched over WebRTC, under a second behind. 409 = the
       broadcaster is not connected yet, so keep knocking; reconnect if the link drops. */
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.autoplay = true;
    if (selfBroadcast) v.muted = true;   /* the autoplay fallback below only ever mutes, so this sticks */
    player.appendChild(v);
    let stopped = false, link = null;
    const connect = async () => {
      if (stopped) return;
      try {
        const s = await play(abs, v);
        if (stopped) { s.stop(); return; }   /* torn down while the handshake was in flight */
        link = s;
        v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
        s.pc.addEventListener('connectionstatechange', () => {
          if (['failed', 'disconnected', 'closed'].includes(s.pc.connectionState) && !stopped) { try { s.stop(); } catch (e) {} setTimeout(connect, 3000); }
        });
      } catch (e) { setTimeout(connect, e && e.status === 409 ? 4000 : 6000); }
    };
    connect();
    unmount = () => { stopped = true; if (link) { try { link.stop(); } catch (e) {} } };
    window.addEventListener('pagehide', () => { stopped = true; });
    v.addEventListener('playing', () => player.classList.add('playing'));
    brandChrome(player, title);
    document.getElementById('badge').style.display = '';
    document.getElementById('ttl').textContent = title;
    return;
  }
  if (/\.m3u8(\?|$)/i.test(abs)) {
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.autoplay = true;
    v.loop = isDemo;   /* looping the tail of a finished class would still read LIVE */
    v.addEventListener('error', () => playerFail(player, 'The stream stopped responding.'));
    player.appendChild(v);
    if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = abs;
    } else {
      let Hls;
      try { ({ default: Hls } = await import('https://cdn.jsdelivr.net/npm/hls.js@1.5.13/+esm')); }
      catch (e) { playerFail(player, 'The video player could not load. Check your connection or any blocker.'); return; }
      if (Hls.isSupported()) {
        const h = new Hls({ liveSyncDurationCount: 3 });
        h.loadSource(abs); h.attachMedia(v);
        unmount = () => { try { h.destroy(); } catch (e) {} };
        h.on(Hls.Events.ERROR, (ev, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { try { h.startLoad(); } catch (e) {} }
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { try { h.recoverMediaError(); } catch (e) {} }
          else { try { h.destroy(); } catch (e) {} playerFail(player, 'The stream stopped responding.'); }
        });
      } else { playerFail(player, 'This browser cannot play live video. Try Chrome, Safari, or Edge.'); return; }
    }
    v.addEventListener('playing', () => player.classList.add('playing'));
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
    brandChrome(player, title);
  } else {
    const src = embedUrl(abs);
    if (!src) { playerFail(player, 'That playback link is not one this player can open.'); return; }
    const f = document.createElement('iframe');
    f.src = src; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    player.appendChild(f);
    brandChrome(player, title);
  }
  document.getElementById('badge').style.display = '';
  document.getElementById('ttl').textContent = title;
}
if (liveSess && liveSess.stream_url) {
  mountStream(liveSess.stream_url, liveSess.title).catch(() => {});
  document.getElementById('meta').textContent = metaLine(liveSess);
}

/* room chat (cohort-wide, scoped to the one live session) */
let nm = {};
const scroll = document.getElementById('lcScroll');
const input = document.getElementById('lcInput');
async function loadChat() {
  const { data: msgs } = await sb.from('ea_opil_live_chat').select('*').eq('session_no', sessionNo).order('created_at', { ascending: false }).limit(200);
  if (msgs) msgs.reverse();
  const missing = (msgs || []).map(m => m.user_id).filter(id => !nm[id]);
  if (missing.length) Object.assign(nm, await names(sb, missing));
  const nearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
  scroll.innerHTML = (msgs && msgs.length)
    ? msgs.map(m => `<div class="bub${m.user_id === user.id ? ' me' : ''}">${m.user_id === user.id ? '' : `<div class="who">${esc(nm[m.user_id] || 'Member')}</div>`}<p>${esc(m.body)}</p><div class="w">${when(m.created_at)}</div></div>`).join('')
    : '<div class="empty">Say what you&rsquo;re seeing. The whole cohort is in here.</div>';
  if (nearBottom) scroll.scrollTop = scroll.scrollHeight;
}
function note(msg) {   /* system line at the foot of the room; the next repaint clears it */
  scroll.insertAdjacentHTML('beforeend', `<div class="note">${esc(msg)}</div>`);
  scroll.scrollTop = scroll.scrollHeight;
}
let chatWired = false;   /* one realtime channel and one refresh timer per page, however many times the room opens */
async function openChat() {
  await loadChat();
  if (chatWired) return; chatWired = true;
  try {
    sb.channel('live-room')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ea_opil_live_chat' }, loadChat)
      .subscribe();
  } catch (e) {}
  setInterval(loadChat, 12000);
}
let wakePoll = null;   /* kept so a broadcaster can stop it: a reload under a live camera ends the broadcast */
function armWake() {
  wakePoll = setInterval(async () => {
    const { data } = await sb.from('ea_opil_sessions').select('no').eq('is_live', true).limit(1);
    if (data && data.length && !selfBroadcast) location.reload();
  }, 30000);
}
if (liveSess) {
  await openChat();
} else {
  /* no session_no to read or write under (the insert policy rejects null), so the room stays shut
     and reopens itself the moment a session flips live */
  scroll.innerHTML = '<div class="empty">Chat opens when a session goes live.</div>';
  input.disabled = true; input.placeholder = 'Room opens with the session';
  document.getElementById('lcSend').disabled = true;
  armWake();
}
document.getElementById('lcForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!sessionNo) return;
  const body = input.value.trim(); if (!body) return;
  const { error } = await sb.from('ea_opil_live_chat').insert({ session_no: sessionNo, user_id: user.id, body });
  if (error) {
    let msg = 'Could not send — ' + (error.message || 'try again.');
    if (error.code === '42501') {
      /* lc_write rejects for two reasons — this session went off air, or the account isn't a writer
         (judges pass sess_read and see the LIVE badge but aren't cohort/admin/facilitator) — so ask which before claiming either */
      const { data } = await sb.from('ea_opil_sessions').select('no').eq('no', sessionNo).eq('is_live', true).limit(1);
      msg = (data && data.length) ? 'Only cohort members and the program team can post here.' : "The room is closed — the session isn't live.";
    }
    note(msg); return;
  }
  input.value = ''; loadChat();
});

/* Broadcast control: a coordinator or a facilitator goes live from the room itself, the way
   /live/ works for the Academy, instead of digging through the coordinator page. Everyone
   else gets an empty mount and nothing else changes. */
if (staff) {
  const { data: all } = await sb.from('ea_opil_sessions').select('*').neq('kind', 'milestone').order('no');
  const sessions = (all || []).filter(s => isAdmin || (facSessions || []).includes(s.no));
  const bc = document.getElementById('bc');
  if (!sessions.length) {
    bc.innerHTML = '<div class="hub-note">No sessions to broadcast yet. Ask the coordinator to put you on one.</div>';
  } else {
    const n = new Date(), today = [n.getFullYear(), n.getMonth() + 1, n.getDate()].map(x => String(x).padStart(2, '0')).join('-');   /* local date; toISOString() is UTC and rolls to tomorrow at 7pm Central */
    const pick = sessions.find(s => s.is_live)
      || sessions.find(s => s.session_date === today)
      || sessions.filter(s => s.session_date && s.session_date > today).sort((a, b) => a.session_date.localeCompare(b.session_date))[0]
      || sessions[0];
    const label = (s) => sessLabel(s) + ' · ' + s.title + (s.session_date ? ' · ' + new Date(s.session_date + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' }) : '');
    bc.innerHTML = `<div class="hcard"><div class="hd2"><h2>Broadcast control</h2><span class="mono" style="font-size:11px;color:var(--gold-ink)">PROGRAM TEAM ONLY</span></div>
<div class="bd">
<div class="bc-ctl-row"><select id="bcSess" aria-label="Session">${sessions.map(s => `<option value="${esc(s.no)}"${s.no === pick.no ? ' selected' : ''}>${esc(label(s))}</option>`).join('')}</select></div>
<div class="bc-ctl-row"><button type="button" class="pillbtn" id="bcDemo" title="Plays a sample clip in the room so you can show it without being on camera">Rehearse with a sample video</button><button type="button" class="pillbtn" id="bcGo" hidden>End session</button></div>
<p id="bcNote">Go live from this device below &mdash; your camera, nothing to install, and the session records itself for students to rewatch.</p>
<div id="bcCam"></div>
</div></div>`;
    const sel = document.getElementById('bcSess'), demo = document.getElementById('bcDemo'),
          goBtn = document.getElementById('bcGo'), bnote = document.getElementById('bcNote'), cam = document.getElementById('bcCam');
    const cur = () => sessions.find(s => s.no === Number(sel.value));
    /* End only ever appears for a broadcast this page did not start: a sample-video rehearsal, or a
       session someone left live. A camera broadcast is ended from the panel's own End button. */
    function syncCtl() { const s = cur(); goBtn.hidden = !s.is_live; demo.textContent = s.is_live && s.stream_url === DEMO_URL ? 'Rehearsal is playing' : 'Rehearse with a sample video'; demo.disabled = !!s.is_live; }
    const onAir = (on) => [sel, demo, goBtn].forEach(el => { el.disabled = on; });
    /* wirePanel's own idle label: anything else means the camera is starting, on air, or saving the recording */
    const camIdle = () => { const b = cam.querySelector('.bc-status b'); return !b || b.textContent === 'Camera off'; };
    /* only one live session at a time: clear the current one first. A facilitator's RLS
       only reaches their own sessions, so that clear can touch 0 rows and the second
       update then trips the one-live unique index (23505) — say so instead of going quiet. */
    async function flipLive(no, on, u) {
      if (on) { const c = await sb.from('ea_opil_sessions').update({ is_live: false }).eq('is_live', true); if (c.error) throw new Error(c.error.message); }
      const r = await sb.from('ea_opil_sessions').update(on ? { is_live: true, stream_url: u } : { is_live: false }).eq('no', no);
      if (r.error) throw new Error(r.error.code === '23505' ? "Another session is still live. End that one first (ask the coordinator if it isn't yours)." : r.error.message);
      sessions.forEach(x => { if (x.no === no) { x.is_live = on; if (u) x.stream_url = u; } else if (on) x.is_live = false; });
    }
    function teardown() {
      if (unmount) { try { unmount(); } catch (e) {} } unmount = null;
      const player = document.getElementById('player');
      player.classList.remove('playing'); player.innerHTML = IDLE_HTML;
      document.getElementById('badge').style.display = 'none';
      document.getElementById('ttl').textContent = 'The live room';
      document.getElementById('meta').textContent = '';
    }
    /* The sample clip is hosted on this site and costs nothing: it is how you show the room, or
       rehearse the flow, without going on camera. It is not a recording — nothing is saved. */
    demo.addEventListener('click', async () => {
      if (!camIdle()) { bnote.textContent = 'Finish with the camera first.'; return; }
      const s = cur();
      demo.disabled = true; demo.textContent = 'Starting…';
      try { await flipLive(s.no, true, DEMO_URL); }
      catch (e) { syncCtl(); bnote.textContent = 'Could not start: ' + e.message; return; }
      location.reload();   /* no camera to lose: a reload mounts the player and opens the room */
    });
    goBtn.addEventListener('click', async () => {
      if (!camIdle()) { bnote.textContent = 'Finish with the camera first.'; return; }
      goBtn.disabled = true; goBtn.textContent = 'Ending…';
      try { await flipLive(cur().no, false); }
      catch (e) { goBtn.disabled = false; syncCtl(); bnote.textContent = 'Could not end: ' + e.message; return; }
      location.reload();
    });
    /* Go live from this device. wirePanel binds the session when wired, so the panel is rebuilt
       whenever the pick changes; the pick is locked while the camera is busy so a rebuild can never kill a broadcast. */
    const token = (await sb.auth.getSession()).data.session?.access_token || '';
    function renderPanel() {
      const s = cur(), no = s.no, ttl = sessLabel(s) + ' · ' + s.title;
      cam.innerHTML = panelHTML('bcPanel');
      wirePanel(document.getElementById('bcPanel'), {
        cfg: window.BM_CONFIG, token, room: 'opil', sessionNo: no, title: () => ttl,
        /* no reload here, it would kill the camera: mount the player and open the room in place */
        go: async (watch) => {
          /* stop future ticks, and flag this page as the broadcaster BEFORE the DB write: clearInterval cannot
             cancel a tick already in flight, and its select can be served after is_live commits, so the flag
             is the only thing that keeps it from reloading under the camera */
          clearInterval(wakePoll); wakePoll = null; selfBroadcast = true; onAir(true);
          try { await flipLive(no, true, watch); } catch (e) { selfBroadcast = false; onAir(false); if (!liveSess) armWake(); throw e; }
          sessionNo = no; syncCtl();
          teardown(); mountStream(watch, ttl).catch(() => {});
          document.getElementById('meta').textContent = metaLine(s);
          input.disabled = false; input.placeholder = 'Message the room'; document.getElementById('lcSend').disabled = false;
          await openChat();
        },
        end: async () => {
          try { await flipLive(no, false); }
          catch (e) { bnote.textContent = 'Could not take the session off air: ' + e.message; }
          selfBroadcast = false; teardown(); syncCtl(); onAir(false);
        },
        /* the replay lands on the session as its recording link */
        saved: async (d) => {
          const r = await sb.from('ea_opil_sessions').update({ recording_url: d.watch }).eq('no', no);
          if (r.error) throw new Error(r.error.message);
          s.recording_url = d.watch;
        },
      });
    }
    let panelNo = pick.no;   /* the session the mounted panel is bound to */
    sel.addEventListener('change', () => {
      if (!camIdle()) { sel.value = String(panelNo); bnote.textContent = 'Finish with the camera before switching sessions.'; return; }
      panelNo = Number(sel.value); syncCtl(); renderPanel();
    });
    syncCtl(); renderPanel();
  }
}
</script>
</body></html>

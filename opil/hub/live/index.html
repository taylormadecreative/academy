<style>
.live-grid{display:grid;grid-template-columns:1fr 340px;gap:clamp(18px,2.6vw,30px);align-items:start;padding-bottom:60px}

.player{background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--hair);box-shadow:var(--shadow-card);aspect-ratio:16/9;position:relative}
.player.list{aspect-ratio:auto}.player.list .idle{position:static;padding:28px 20px}   /* the pick-a-room list grows with its rows instead of clipping in 16:9 */
.player .idle .live-row:focus-visible{outline-color:#fff}
.player .idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9fb0d4;background:var(--navy);text-align:center;padding:20px}

.livebadge{display:inline-flex;align-items:center;gap:8px;background:#e8f8f0;color:#067a56;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:980px}
.livebadge i{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.livebadge i{animation:none}}
.chat input:disabled,.chat button:disabled{opacity:.55;cursor:not-allowed}
.chat .note{align-self:center;font-size:12.5px;font-weight:600;color:#b4451f;background:#fdf0e7;border-radius:980px;padding:6px 12px}
/* class control (program team only) */
#bc .hcard{margin-bottom:22px}
.bc-ctl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bc-ctl-row+.bc-ctl-row{margin-top:9px}
.bc-ctl-row select,.bc-ctl-row input{flex:1;min-width:0;font:inherit;font-size:13.5px;padding:9px 13px;border:1.5px solid var(--hair);border-radius:10px;background:#fff;color:var(--ink)}
.bc-ctl-row input{min-width:220px}
#bcNote{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}

#bc .pillbtn{min-height:44px}
#bcLink{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg-soft,#f5f7fb);color:var(--ink-2,#3a4661)}
.bc-cap{font-size:13px;color:var(--muted);margin:2px 0 12px;line-height:1.5}
#bcRec{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#b4451f;background:#fdf0e7;border-radius:980px;padding:0 12px;min-height:44px}
#bcRec i{width:8px;height:8px;border-radius:50%;background:#e0492a;animation:pulse 1.6s ease-in-out infinite}
/* End is two taps: armed, it turns navy and reads the question */
#bcGo[data-armed="1"]{background:var(--navy);color:#fff}
/* the host is out but the class is still running: said plainly, above the Start / End row */
#bcStill{display:grid;gap:3px;margin:0 0 10px;padding:12px 14px;border:1px solid var(--gold,#fdc921);border-radius:12px;background:var(--bg-soft,#f5f7fb)}
#bcStill[hidden]{display:none}

#backOn{margin-top:14px;display:grid;gap:8px;justify-items:center}

/* the no-code door for approved students: one card, one field, one button; everything else waits behind it */
.gated .hub-wrap > :not(#pass){display:none}
.pass{max-width:560px;margin:48px auto;padding:32px 28px}
.pass h1{font:700 clamp(28px,4vw,38px)/1.1 'Space Grotesk',Inter,sans-serif;margin:10px 0 8px;letter-spacing:-.02em}

.pass input{min-height:52px;font-size:17px;padding:0 16px;border:1.5px solid var(--hair);border-radius:999px}
.pass input:focus{outline:none;border-color:var(--navy,#0a1733);box-shadow:0 0 0 4px rgba(4,18,58,.12)}

.pass .err{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:#fff3f3;color:#8a1f1f;font-size:15px}

@media (max-width:520px){.pass form{grid-template-columns:1fr}.pass{margin:16px auto;padding:24px 18px}}

<script src="/js/config.js?v=5d8beccdf8"></script>
<script type="module">
import { boot, names, esc, when, nav } from '/opil/hub/hub.js?v=5d8beccdf8';
import { roomFromQuery, pickRoom, roomPath, sessLabel, liveListHTML, useV2, recChipHidden, endCopy, backOn, passCopy } from '/opil/hub/live-rooms.js?v=5d8beccdf8';
/* No code for approved students (Nelson, 9/16 — the first class ever: "make it to where the students do
   not need codes to get into the classroom … they've already been approved"). A signed-out visitor on a
   room link types the email they applied with; ea-opil-pass checks the approved list and hands back a
   one-time token the browser redeems on the spot. Staff (not on the list) take the code sign-in link.
   Only this page has the door — the rest of the hub still bounces to /login/. */
{
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const sb0 = createClient(window.BM_CONFIG.SUPABASE_URL, window.BM_CONFIG.SUPABASE_KEY);
  if (!(await sb0.auth.getSession()).data.session) {
    await new Promise((resolve) => {
      const main = document.querySelector('main.hub-wrap');
      const card = document.createElement('section');
      card.className = 'hcard pass'; card.id = 'pass';
      card.innerHTML = `<span class="kicker gold">Live session</span>
        <h1>Welcome to the Lab.</h1>
        <p class="lead">Type the email you applied with and you’re in. No code, no password.</p>
        <form id="passForm" novalidate><input id="passEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@school.edu" required><button type="submit" id="passGo">Continue →</button></form>
        <p class="err" id="passErr" role="alert" hidden></p>
        <p class="small">Facilitators and the program team <a id="passStaff" href="#">sign in with a code</a>. Students can too if the email above won’t go through.</p>`;
      document.body.classList.add('gated');
      main.prepend(card);
      card.querySelector('#passStaff').href = '/login/?next=' + encodeURIComponent(location.pathname + location.search);
      const form = card.querySelector('#passForm'), input = card.querySelector('#passEmail'), go = card.querySelector('#passGo'), err = card.querySelector('#passErr');
      const say = (code) => { err.textContent = passCopy(code); err.hidden = false; };
      form.addEventListener('submit', async (e) => {
        e.preventDefault(); err.hidden = true;
        const email = input.value.trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say('bad_email'); input.focus(); return; }
        go.disabled = true; go.textContent = 'One moment…';
        try {
          const res = await fetch(window.BM_CONFIG.FUNCTIONS_BASE + '/ea-opil-pass', { method: 'POST', headers: { 'content-type': 'application/json', 'apikey': window.BM_CONFIG.SUPABASE_KEY || '' }, body: JSON.stringify({ email }) });
          const j = await res.json().catch(() => ({}));
          if (!res.ok || !j.token_hash) { say(j.error || 'server'); return; }
          const { error } = await sb0.auth.verifyOtp({ token_hash: j.token_hash, type: 'magiclink' });
          if (error) { say('verify'); return; }
          card.remove(); document.body.classList.remove('gated'); resolve();
        } catch (e) { say('server'); }
        finally { go.disabled = false; go.textContent = 'Continue →'; }
      });
      input.focus();
    });
  }
}
/* Room v2 (the concept boards: join screen, state in words, question queue).
   ROOM_V2 = true makes it the default for everyone; ?v2=1 opens it for one visit while the flag is
   off (testing), ?classic=1 opens the kit's own shell for one visit while the flag is on. */
const ROOM_V2 = true;    /* real-room check passed 2026-09-14 (start, enter, panel, tools, effects, leave) */
const v2 = useV2(location.search, ROOM_V2);
const ctx = await boot(); if (!ctx) throw new Error('gate');
const { sb, user, isAdmin, facSessions } = ctx;
const staff = isAdmin || (facSessions || []).length > 0;   /* coordinators and facilitators get the class control */
nav(ctx, 'live');

/* One way to be live: the class room (RealtimeKit, everyone on camera). A session's stream_url
   holds "rtk:<meeting id>" while its class runs. Nelson, 2026-09-14: "there should be no camera
   broadcast option at all, i only want the classroom zoom like view" — the one-way camera
   broadcast and the rehearsal clip were removed from this page and the coordinator page. */
const RTK_PREFIX = 'rtk:';
const isRoom = (u) => typeof u === 'string' && u.startsWith(RTK_PREFIX);
const ec = endCopy();   /* the Leave / End words: "End the class for everyone", "You left — the class is still running." */

/* which room: ?s=<no> names one (live or waiting); with no s, the one live session, or a list
   when several are. Milestones are never rooms. Rooms are independent since 0032. */
const wanted = roomFromQuery(location.search);
const { data: allSess } = await sb.from('ea_opil_sessions').select('*').neq('kind', 'milestone').order('no');
let pickedRoom = pickRoom(allSess || [], wanted);
/* an instructor on the bare URL came to run THEIR session: show the control and whatever is live,
   never drop them into a colleague's class. Students and judges keep the straight-in behaviour. */
if (wanted == null && staff && pickedRoom.mode === 'room') pickedRoom = { mode: 'list', live: [pickedRoom.session] };
const badLink = wanted != null && !(allSess || []).some(s => s.no === wanted);   /* ?s= names nothing on the calendar */
const roomSess = pickedRoom.mode === 'room' ? pickedRoom.session : null;         /* the session this page is bound to */
/* …and on air only when a class is actually running in it (a stale non-room stream_url is not a class) */
const liveSess = roomSess && roomSess.is_live && isRoom(roomSess.stream_url) ? roomSess : null;
let sessionNo = roomSess ? roomSess.no : null;
const metaLine = (s) => 'Session ' + sessLabel(s) + (s.outcome ? ' · Today you leave with: ' + s.outcome : '');
async function facilitatorName(no) { try { const { data } = await sb.rpc('ea_opil_session_facilitator', { p_session: no }); return data || null; } catch (e) { return null; } }
let hosting = false;   /* this page runs the class from the control (Start, or Enter the running class): the wake poll must never reload it from under the host */
let room = null;       /* the joined class, so Start can tear a viewer's room down before opening its own */
let mounting = false;  /* a mount under way (Start, Enter, the straight-in entry while live) — one at a time, page-wide */
let onMountSettled = null;   /* the class control hooks this: redraw its button when a mount starts or settles */
let onLeft = null;     /* the class control hooks this: (st, reason) once this person is out of the room */
let onJoined = null;   /* …and starts the recording the moment the host is actually in the room */
let backPoll = null;   /* the ended card's own listener: the way back in once a class runs again */
let livePoll = null;   /* while IN the room: is this session still on air? (a class ended from outside the room) */
let closing = false;   /* livePoll is closing the room itself and will say 'ended' when it is done */
/* the in-room row poll: 20 s. The harness (tests/ht/harness/opil-live.mjs) shortens it through window.__opilRoomPollMs
   so a class ended from outside the room can be watched in seconds; nothing else reads that. */
const POLL_MS = Number(window.__opilRoomPollMs) > 0 ? Number(window.__opilRoomPollMs) : 20000;

/* Nobody ends a class by accident (Nelson, 9/15). onState: 'joined' (first join, or reason 'rejoined' after a
   drop the room mended on its own), 'reconnecting' (a drop being mended — nothing to do), 'left' (Leave, or
   'dropped' = a drop that could not be mended, or 'kicked'), 'ended' (the explicit End — Tools in the room or
   the control's two-tap End). A 'left' NEVER ends the class, whoever this page belongs to. */
const roomState = (st, meeting, reason) => {
  if (st === 'joined') { armLivePoll(); if (onJoined) onJoined(reason); return; }
  if (st !== 'ended' && st !== 'left') return;
  if (livePoll) { clearInterval(livePoll); livePoll = null; }
  document.body.classList.remove('in-room', 'in-room-v2'); room = null;
  if (closing) return;   /* the poll is closing the room and says 'ended' itself once the leave is through */
  if (onLeft) onLeft(st, reason);
  afterRoom(st, reason);
};
/* While in the room, ask every 20 s whether this session is still on air — the way a class ended from OUTSIDE the
   room reaches the people in it (the host's End pressed out of the room after a Leave or a drop, a coordinator's End
   from another page). The kit only tells them when the meeting is closed, and an OPIL session keeps its meeting
   across classes. Off air → leave, then the ended card (host pages close their control the same way). */
function armLivePoll() {
  if (livePoll) return;
  livePoll = setInterval(async () => {
    const no = boundNo != null ? boundNo : (roomSess ? roomSess.no : sessionNo);
    if (no == null || !room || closing) return;
    let s; try { const { data } = await sb.from('ea_opil_sessions').select('no,is_live,stream_url').eq('no', no).limit(1); s = data && data[0]; } catch (e) { return; }
    if (!s || (s.is_live !== false && isRoom(s.stream_url))) return;
    if (!room || closing) return;   /* the room went away while we asked */
    closing = true;
    try { await room.leave(); } catch (e) {}
    closing = false;
    roomState('ended', null, 'ended');
  }, POLL_MS);
}
/* What the room becomes once this person is out of it (a page that runs the class from the control has its
   own line there and skips this): they left, or their connection dropped and could not be mended → an
   honest line and one Rejoin button; the class ended or they were removed → said plainly, with the way back
   to their hub, and the page keeps listening: once the class has been seen off air and runs again, the
   way back in appears (backOn) — nobody is stranded when the next class starts. */
function afterRoom(st, reason) {
  if (hosting) return;
  document.getElementById('badge').style.display = 'none';
  const no = boundNo != null ? boundNo : (roomSess ? roomSess.no : sessionNo);
  const liveNow = async () => { const { data } = await sb.from('ea_opil_sessions').select('no,title,is_live,stream_url').eq('no', no).limit(1); return data && data[0]; };
  const goIn = async (btn) => {
    btn.disabled = true; btn.textContent = 'Rejoining…';
    const s = await liveNow();
    if (!s || !s.is_live || !isRoom(s.stream_url)) { afterRoom('ended', 'ended'); return; }
    document.getElementById('badge').style.display = '';
    try { await enterRoom(s.no, s.stream_url.slice(RTK_PREFIX.length), sessLabel(s) + ' · ' + s.title); }
    catch (e) { idleEl.innerHTML = '<b>' + esc(e.message || 'Could not rejoin.') + '</b><span>Reload to try again.</span>'; }
  };
  if (reason !== 'ended' && reason !== 'kicked') {
    idleEl.innerHTML = '<b>' + esc(reason === 'dropped' ? 'Your connection dropped.' : 'You left the class.') + '</b><span>' + esc(reason === 'dropped' ? 'The class is still running — come back in.' : 'Need to come back? It picks up where it is.') + '</span><button type="button" class="pillbtn" id="rejoinBtn" style="margin-top:6px">Rejoin the class &rarr;</button>';
    document.getElementById('rejoinBtn').addEventListener('click', (ev) => goIn(ev.target));
    return;
  }
  idleEl.innerHTML = '<b>Class ended.</b><span>Thanks for being here. The replay shows on your hub home once the program team publishes it.</span><a class="pillbtn" href="/opil/hub/" style="margin-top:6px">Back to my hub &rarr;</a>' +
    '<div id="backOn" hidden><span>' + esc(ec.backOn) + '</span><button type="button" class="pillbtn" id="backBtn">' + esc(ec.rejoin) + '</button></div>';
  document.getElementById('backBtn').addEventListener('click', (ev) => goIn(ev.target));
  if (backPoll) { clearInterval(backPoll); backPoll = null; }
  let on = backOn({ seenOff: false }, null);   /* the row flips off air a moment after the kick: the first look at 5 s sees it */
  const tick = async () => {
    try {
      const s = await liveNow(); if (!s) return;
      on = backOn(on, !!s.is_live && isRoom(s.stream_url));
      if (on.again) { const b = document.getElementById('backOn'); if (b) b.hidden = false; clearInterval(backPoll); backPoll = null; }
    } catch (e) {}
  };
  backPoll = setInterval(tick, 20000); setTimeout(tick, 5000);
}
/* v2 takes the session object and a mode; onOpened fires for a host the moment the meeting exists,
   before they press Enter — that is when the session flips live */
async function enterRoomV2({ session, mode, meetingId, onOpened }) {
  const { mountRoomV2 } = await import('/js/rtk-room-v2.js?v=5d8beccdf8');
  const tok = (await sb.auth.getSession()).data.session?.access_token || '';
  const facilitator = await facilitatorName(session.no);
  document.getElementById('ttl').textContent = sessLabel(session) + ' · ' + session.title;
  if (mode !== 'waiting') { document.getElementById('badge').style.display = ''; }
  const top = document.getElementById('rtkMount').getBoundingClientRect().top + window.scrollY - 72;
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  /* one mount at a time, page-wide: the control's button reads Entering… and refuses a second mount until this one
     settles — the host on their camera-check screen must never be handed an "Enter the running class" that mounts
     a second room on top of the first (two kit clients, the first holding the camera for good) */
  mounting = true; if (onMountSettled) onMountSettled();
  try { room = await mountRoomV2({ mountEl: document.getElementById('rtkMount'), cfg: window.BM_CONFIG, token: tok, sb, user, session, mode, meetingId: meetingId || null, facilitator, onState: roomState, onOpened }); return room; }
  finally { mounting = false; if (onMountSettled) onMountSettled(); }
}
async function enterRoom(no, meetingId, title) {
  if (v2) { const sess = (allSess || []).find(s => s.no === no) || roomSess; return enterRoomV2({ session: sess, mode: 'student', meetingId }); }
  const { mountRoom } = await import('/js/rtk-room.js?v=5d8beccdf8');
  const tok = (await sb.auth.getSession()).data.session?.access_token || '';
  mounting = true; if (onMountSettled) onMountSettled();
  try {
    room = await mountRoom({
      mountEl: document.getElementById('rtkMount'), cfg: window.BM_CONFIG, token: tok,
      sessionNo: no, meetingId,
      onState: roomState,
    });
  } finally { mounting = false; if (onMountSettled) onMountSettled(); }
  document.getElementById('badge').style.display = '';
  document.getElementById('ttl').textContent = title;
  /* put the room under the reader's eyes: starting a class from the control below leaves the
     video off-screen otherwise. A plain scroll, not scrollIntoView, which steals the tab order. */
  const top = document.getElementById('rtkMount').getBoundingClientRect().top + window.scrollY - 72;
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  return room;
}

const idleEl = document.getElementById('idle');
const playerEl = document.getElementById('player');
const NOTHING_HTML = '<b>No class is running right now.</b><span>When a facilitator starts one, it appears here and on everyone’s hub home.</span>';
if (badLink) {
  const n = document.createElement('div'); n.className = 'hub-note';
  n.textContent = 'That link doesn’t point to a session on the calendar. Here is what is live instead.';
  document.querySelector('.live-grid').insertAdjacentElement('beforebegin', n);
}
const liveLabel = (list) => (list.length === 1 ? '1 room is live right now.' : list.length + ' rooms are live right now.');
function renderList(list) {
  playerEl.classList.add('list');
  idleEl.innerHTML = '<b>' + liveLabel(list) + '</b><span>Pick yours.</span><div class="live-list" id="liveList">' + liveListHTML(list, esc) + '</div>';
}
if (liveSess) {
  /* students and judges land straight in */
  enterRoom(liveSess.no, liveSess.stream_url.slice(RTK_PREFIX.length), liveSess.title)
    .catch((e) => {
      const hint = e.code === 'not_allowed' ? 'Ask the coordinator to add you to the cohort.' : e.code === 'not_open' ? 'Stay on this page — it opens by itself.' : 'Reload to try again.';
      idleEl.innerHTML = '<b>' + esc(e.message || 'Could not open the class.') + '</b><span>' + hint + '</span>';
    });
} else if (roomSess && v2 && !staff) {
  /* a room link opened before the class started: "You're in the right place" + what happens next;
     the poll below reloads when it flips live and v2 walks them straight in */
  enterRoomV2({ session: roomSess, mode: 'waiting' }).catch(() => {});
} else if (roomSess) {
  /* a room link opened before the class started: students wait here (the poll below reloads when it
     flips live); the instructor is told the room is theirs to start */
  document.getElementById('ttl').textContent = sessLabel(roomSess) + ' · ' + roomSess.title;
  document.getElementById('meta').textContent = metaLine(roomSess);
  idleEl.innerHTML = staff
    ? '<b>This room is yours.</b><span>Start the class from the control above &mdash; students who have your link are waiting here.</span>'
    : '<b>This room opens when your facilitator starts it.</b><span>Stay on this page &mdash; it opens by itself.</span>';
} else if (pickedRoom.mode === 'list') {
  renderList(pickedRoom.live);
} else {
  idleEl.innerHTML = NOTHING_HTML;
}

/* room chat (cohort-wide, scoped to this room's session) */
let nm = {};
const scroll = document.getElementById('lcScroll');
const input = document.getElementById('lcInput');
async function loadChat() {
  const { data: msgs } = await sb.from('ea_opil_live_chat').select('*').eq('session_no', sessionNo).order('created_at', { ascending: false }).limit(200);
  if (msgs) msgs.reverse();
  const missing = (msgs || []).map(m => m.user_id).filter(id => !nm[id]);
  if (missing.length) Object.assign(nm, await names(sb, missing));
  const nearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
  scroll.innerHTML = (msgs && msgs.length)
    ? msgs.map(m => `<div class="bub${m.user_id === user.id ? ' me' : ''}">${m.user_id === user.id ? '' : `<div class="who">${esc(nm[m.user_id] || 'Member')}</div>`}<p>${esc(m.body)}</p><div class="w">${when(m.created_at)}</div></div>`).join('')
    : '<div class="empty">Say what you&rsquo;re seeing. The whole cohort is in here.</div>';
  if (nearBottom) scroll.scrollTop = scroll.scrollHeight;
}
function note(msg) {   /* system line at the foot of the room; the next repaint clears it */
  scroll.insertAdjacentHTML('beforeend', `<div class="note">${esc(msg)}</div>`);
  scroll.scrollTop = scroll.scrollHeight;
}
let chatWired = false;   /* one realtime channel and one refresh timer per page, however many times the room opens */
async function openChat() {
  await loadChat();
  if (chatWired) return; chatWired = true;
  try {
    sb.channel('live-room-' + sessionNo)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ea_opil_live_chat', filter: 'session_no=eq.' + sessionNo }, loadChat)
      .subscribe();
  } catch (e) {}
  setInterval(loadChat, 12000);
}
function enableChat() {
  input.disabled = false; input.placeholder = 'Message the room'; document.getElementById('lcSend').disabled = false;
}
let wakePoll = null;   /* kept so a host can stop it: a reload under a running class would drop the host's camera */
let boundNo = roomSess ? roomSess.no : null;   /* the room this page is bound to; bindUrl() moves it when a host starts one */
function armWake() {
  wakePoll = setInterval(async () => {
    if (hosting) return;
    if (pickedRoom.mode === 'list' && boundNo == null) {
      /* the pick-a-room view refreshes its rows in place; a reload every 30 s would yank the page away mid-choice */
      const { data } = await sb.from('ea_opil_sessions').select('*').eq('is_live', true).neq('kind', 'milestone').order('no');
      const now = (data || []);
      if (now.map(s => s.no).join(',') !== pickedRoom.live.map(s => s.no).join(',')) {
        pickedRoom = now.length ? { mode: 'list', live: now } : { mode: 'idle' };
        if (now.length) renderList(now);
        else { playerEl.classList.remove('list'); idleEl.innerHTML = NOTHING_HTML; }
      }
      return;
    }
    let q = sb.from('ea_opil_sessions').select('no,stream_url').eq('is_live', true);
    if (boundNo != null) q = q.eq('no', boundNo);   /* a named room waits for ITS session, not whichever goes live first */
    const { data } = await q.limit(1);
    if (data && data.length && isRoom(data[0].stream_url)) location.reload();
  }, 30000);
}
if (liveSess) {
  await openChat();
} else {
  /* nothing live to read or write under (the insert policy checks the session is live), so the room
     stays shut and reopens itself the moment the session flips live */
  scroll.innerHTML = '<div class="empty">' + (roomSess ? 'Chat opens when this room goes live.' : 'Chat opens when a class starts.') + '</div>';
  input.disabled = true; input.placeholder = 'Room opens with the class';
  document.getElementById('lcSend').disabled = true;
  armWake();
}
document.getElementById('lcForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!sessionNo) return;
  const body = input.value.trim(); if (!body) return;
  const { error } = await sb.from('ea_opil_live_chat').insert({ session_no: sessionNo, user_id: user.id, body });
  if (error) {
    let msg = 'Could not send — ' + (error.message || 'try again.');
    if (error.code === '42501') {
      /* lc_write rejects for two reasons — this session went off air, or the account isn't a writer
         (judges pass sess_read and see the LIVE badge but aren't cohort/admin/facilitator) — so ask which before claiming either */
      const { data } = await sb.from('ea_opil_sessions').select('no').eq('no', sessionNo).eq('is_live', true).limit(1);
      msg = (data && data.length) ? 'Only cohort members and the program team can post here.' : "The room is closed — the class isn't running.";
    }
    note(msg); return;
  }
  input.value = ''; loadChat();
});

/* Class control: a coordinator or a facilitator starts the class from the room itself.
   Everyone else gets an empty mount and nothing else changes. */
if (staff) {
  const sessions = (allSess || []).filter(s => isAdmin || (facSessions || []).includes(s.no));
  const bc = document.getElementById('bc');
  if (!sessions.length) {
    bc.innerHTML = '<div class="hub-note">No sessions to run yet. Ask the coordinator to put you on one.</div>';
  } else {
    const n = new Date(), today = [n.getFullYear(), n.getMonth() + 1, n.getDate()].map(x => String(x).padStart(2, '0')).join('-');   /* local date; toISOString() is UTC and rolls to tomorrow at 7pm Central */
    /* the room the URL names; else today's, the next one up, one that is live, the first */
    const pick = (roomSess && sessions.find(s => s.no === roomSess.no))
      || sessions.find(s => s.session_date === today)
      || sessions.filter(s => s.session_date && s.session_date > today).sort((a, b) => a.session_date.localeCompare(b.session_date))[0]
      || sessions.find(s => s.is_live)
      || sessions[0];
    const label = (s) => sessLabel(s) + ' · ' + s.title + (s.session_date ? ' · ' + new Date(s.session_date + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' }) : '');
    bc.innerHTML = `<div class="hcard"><div class="hd2"><h2>Your class</h2><span class="mono" style="font-size:11px;color:var(--gold-ink)">PROGRAM TEAM ONLY</span></div>
<div class="bd">
<div class="bc-ctl-row"><select id="bcSess" aria-label="Session">${sessions.map(s => `<option value="${esc(s.no)}"${s.no === pick.no ? ' selected' : ''}>${esc(label(s))}</option>`).join('')}</select></div>
<div class="bc-ctl-row"><input id="bcLink" readonly aria-label="Link to this room" value=""><button type="button" class="pillbtn" id="bcCopy" aria-live="polite">Copy link</button></div>
<p class="bc-cap">Send this link to your students. It works before you start &mdash; they wait in the room until you do.</p>
<div id="bcStill" hidden><b>${esc(ec.stillRunning)}</b><span>${esc(ec.stillRunningHint)}</span></div>
<div class="bc-ctl-row"><button type="button" class="pillbtn" id="bcClass" style="background:var(--blue);color:#fff" title="Everyone on camera: you teach, students can turn their camera and mic on, raise a hand, and share their screen">Start class &mdash; everyone on camera</button><button type="button" class="pillbtn" id="bcGo" hidden title="${esc(ec.endHint)}. Two taps.">${esc(ec.endButton)}</button><span id="bcRec" hidden><i></i>Recording</span></div>
<p id="bcNote">1. Pick your session. &nbsp;2. Copy the link and send it to your students. &nbsp;3. Start class, then press Enter in the room. Leave only leaves &mdash; the class keeps running and you can come back. To end it for everyone, use Tools in the room or the End button here.</p>
</div></div>`;
    const sel = document.getElementById('bcSess'), classBtn = document.getElementById('bcClass'),
          goBtn = document.getElementById('bcGo'), bnote = document.getElementById('bcNote'), stillEl = document.getElementById('bcStill');
    let leftNo = null;      /* the running session this page's host is OUT of (Leave, a drop, a second screen) */
    let entering = false;   /* a mount under way — one at a time */
    const cur = () => sessions.find(s => s.no === Number(sel.value));
    const linkEl = document.getElementById('bcLink'), copyBtn = document.getElementById('bcCopy');
    /* the link an instructor sends out: absolute, and it works before the class starts */
    const syncLink = () => { linkEl.value = location.origin + roomPath(Number(sel.value)); };
    copyBtn.addEventListener('click', async () => {
      linkEl.select();
      let done = false;
      try { await navigator.clipboard.writeText(linkEl.value); done = true; } catch (e) {}
      if (!done) { try { done = document.execCommand('copy'); } catch (e) {} }   /* older WebViews: the selection is copied the old way */
      copyBtn.textContent = done ? 'Copied' : (/Mac|iPhone|iPad/.test(navigator.platform) ? 'Press ⌘C' : 'Press Ctrl+C');
      setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1600);
    });
    /* bind the host's page to the room it is running, so a reload after End lands back in it */
    const bindUrl = (no) => { boundNo = no; try { history.replaceState(null, '', roomPath(no)); } catch (e) {} };
    /* The class records itself: start right after the room opens, stop when the host leaves. The
       replay lands on the coordinator page as a draft; nobody in the room presses Record. */
    const recChip = document.getElementById('bcRec');
    let pendingRecord = null;   /* the session whose recording starts on the host's 'joined' */
    let recFor = null;          /* the session this page has a recording running for; syncCtl() owns the chip */
    let recPoll = null;         /* while the host is OUT of a running class: is the recording still alive? (Cloudflare ends one that sits empty for 60 s) */
    onMountSettled = syncCtl;
    onJoined = async () => {
      leftNo = null; stopRecPoll(); syncCtl();
      if (pendingRecord == null) return;
      const no = pendingRecord; pendingRecord = null;
      /* start is idempotent server-side: a recording still running is reused, one Cloudflare says has ended is
         replaced — so every entry (Start, Enter, Rejoin) asks, and the chip and the strip tell the truth */
      try { await record('start', no); recFor = no; syncCtl(); if (room && room.setRecording) room.setRecording(true); }
      catch (e) { bnote.textContent = 'You\u2019re in, but the replay could not start recording (' + (e.message || e) + '). The class itself is fine.'; }
    };
    async function record(action, no) {
      const tok = (await sb.auth.getSession()).data.session?.access_token || '';
      const r = await fetch(window.BM_CONFIG.FUNCTIONS_BASE + '/ea-rtk-record', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
        body: JSON.stringify({ session_no: no, action }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { const e = new Error(plainErr(d.error || ('server_' + r.status))); e.code = d.error; throw e; }
      return d;
    }
    /* the host is out of a class that keeps running: every 20 s, does a recording row still say invoked / recording?
       When none does, the chip goes dark — the strip's "the recording is still going" must never outlive the recording. */
    const stopRecPoll = () => { if (recPoll) { clearInterval(recPoll); recPoll = null; } };
    function armRecPoll(no) {
      stopRecPoll();
      recPoll = setInterval(async () => {
        if (leftNo !== no || recFor !== no) return stopRecPoll();
        try {
          const { data } = await sb.from('ea_opil_replays').select('status').eq('session_no', no).in('status', ['invoked', 'recording']).limit(1);
          if (data && !data.length) { recFor = null; syncCtl(); stopRecPoll(); }
        } catch (e) {}
      }, POLL_MS);
    }
    const plainErr = (code) => ({
      not_host: 'only the facilitator of this session can record it', no_room: 'the room isn\u2019t open yet', sign_in: 'you were signed out \u2014 reload and sign in again',
      rtk_not_configured: 'the recording service isn\u2019t set up', server: 'the recording service didn\u2019t answer',
    }[String(code)] || (/^(cloudflare_|server_)/.test(String(code)) ? 'the recording service didn\u2019t answer' : String(code)));
    /* a reload mid-class: the recording is still running server-side — show the chip so the host knows */
    (async () => {
      if (!roomSess || !roomSess.is_live) return;
      const { data } = await sb.from('ea_opil_replays').select('status').eq('session_no', roomSess.no).in('status', ['invoked', 'recording']).limit(1);
      if (data && data.length) { recFor = roomSess.no; syncCtl(); }
    })();
    /* …and a host who came straight in on their live link (the entry above the control) asks the recording to
       start again on their 'joined', like Enter and Rejoin do: reused while it runs, replaced once it ended */
    if (liveSess && sessions.some(x => x.no === liveSess.no)) pendingRecord = liveSess.no;
    /* End shows for any session left live. Start is never reachable while a class is genuinely running in it:
       the same button then reads Enter / Rejoin and re-enters the running meeting (the join function reuses the
       session's stored meeting — it never creates a second one). A session flagged live with a stale non-room
       stream_url can still be started, which overwrites it. */
    function syncCtl() {
      const s = cur();
      const running = !!s.is_live && isRoom(s.stream_url);
      const out = running && leftNo === s.no;
      const busy = entering || mounting;   /* a mount under way — this page's, or the straight-in entry while live */
      goBtn.hidden = !s.is_live;
      classBtn.disabled = busy || (running && !!room);
      classBtn.innerHTML = busy ? (entering && !running ? 'Opening the room…' : 'Entering…') : !running ? 'Start class &mdash; everyone on camera' : room ? 'Class is running' : out ? 'Rejoin the running class &rarr;' : 'Enter the running class';
      stillEl.hidden = !out;
      recChip.hidden = recChipHidden({ running, recFor, sessionNo: s.no });
    }
    /* on air: the session picker and Start step back; End stays — it is the one way to end the class from here */
    const onAir = (on) => [sel, classBtn].forEach(el => { el.disabled = on; });
    /* the end of the class — ONLY after the explicit End (Tools in the room, or the two-tap End here) */
    async function closeClass(no) {
      hosting = false; leftNo = null; pendingRecord = null; stopRecPoll();
      let recorded = false;
      try { recorded = !!(await record('stop', no)).stopped; } catch (e) {}
      recFor = null;
      try { await flipLive(no, false); }
      catch (e) { onAir(false); syncCtl(); bnote.textContent = 'The class could not be closed (' + e.message + '). Press ' + ec.endButton + ' again.'; return false; }
      onAir(false); syncCtl();
      bnote.textContent = recorded
        ? 'Class ended — the replay is being prepared. It shows on your sessions page (Coordinator, or My sessions) when it is ready to review; students see it once it is published.'
        : 'Class ended — the room is closed for everyone. Start class to open it again.';
      return true;
    }
    /* Out of the room. 'ended' (the explicit End, by this page or another host's) closes the row — for a session
       this page may run; a coordinator or facilitator sitting in a colleague's class just steps back. 'left',
       'dropped' and 'kicked' (a second screen took the seat) NEVER close anything: the class keeps running, the
       recording keeps going, and the control offers Rejoin and End. (Nelson, 9/15: "i never asked for a rule
       anywhere to cut off a class I am in the middle of talking on".) */
    onLeft = async (st, reason) => {
      const no = boundNo != null ? boundNo : (roomSess ? roomSess.no : cur().no);
      const mine = sessions.some(x => x.no === no);
      if (st === 'ended') { if (mine) await closeClass(no); else { recFor = null; onAir(false); syncCtl(); } return; }
      onAir(false);
      if (!mine) { syncCtl(); return; }
      leftNo = no; syncCtl();
      if (recFor === no) armRecPoll(no);
      bnote.textContent = reason === 'kicked'
        ? 'Another screen took your seat — you’re hosting from there now. Rejoin here to take it back, or end the class for everyone from Tools there or the button here.'
        : reason === 'dropped'
          ? 'Your connection dropped and the room could not get you back in on its own. The class is still running — press Rejoin.'
          : 'You left the room. The class keeps running for your students and the recording keeps going. Press Rejoin to go back in, or ' + ec.endButton + '.';
    };
    /* Rooms are independent (0032): starting one never touches another. */
    async function flipLive(no, on, u) {
      const r = await sb.from('ea_opil_sessions').update(on ? { is_live: true, stream_url: u } : { is_live: false }).eq('no', no);
      if (r.error) throw new Error(r.error.message);
      sessions.forEach(x => { if (x.no === no) { x.is_live = on; if (u) x.stream_url = u; } });
    }
    /* Start class: the server opens the meeting and hands this host a token; the id is written
       onto the session as "rtk:<id>" so every student's page joins the same room. No reload —
       that would drop the camera we are about to use. */
    /* Enter / Rejoin a running class as its host: the same meeting (the server reuses the session's stored one);
       the recording is asked to start again (idempotent server-side: reused while it runs, replaced once it ended) */
    async function enterRunning(s) {
      if (entering || mounting || room) return;
      entering = true; syncCtl();
      /* the row is re-read first: a host who left, whose class a colleague then ended, must not walk back into a
         session that is off air (a recording would start on a class nobody can join) */
      try {
        const { data } = await sb.from('ea_opil_sessions').select('is_live,stream_url').eq('no', s.no).limit(1);
        const now = data && data[0];
        if (now && !(now.is_live && isRoom(now.stream_url))) {
          s.is_live = !!now.is_live; s.stream_url = now.stream_url; entering = false; leftNo = null; onAir(false); syncCtl();
          bnote.textContent = 'The class has ended since you left — the replay lands on your sessions page. Start class opens it again.';
          return;
        }
      } catch (e) {}
      try {
        clearInterval(wakePoll); wakePoll = null; hosting = true;
        if (backPoll) { clearInterval(backPoll); backPoll = null; }
        await enterRoomV2({ session: s, mode: 'host', onOpened: async () => {
          sessionNo = s.no; bindUrl(s.no); onAir(true); syncCtl();
          /* always: start is idempotent (a live recording is reused), and a recording that sat with nobody in it
             for 60 s has ended — the meeting the host walks back into must be recorded again */
          pendingRecord = s.no;
          enableChat(); await openChat();
        } });
        entering = false; leftNo = null; syncCtl();
      } catch (e) {
        entering = false; onAir(false); syncCtl();
        bnote.textContent = 'Could not get back into the class: ' + (e.message || e) + '. Try again, or ' + ec.endButton + '.';
      }
    }
    classBtn.addEventListener('click', async () => {
      const s = cur();
      if (entering || mounting) return;
      if (s.is_live && isRoom(s.stream_url)) return enterRunning(s);
      entering = true; classBtn.disabled = true; classBtn.textContent = 'Opening the room…';   /* the button reads Entering… once the row is live, until the host is in */
      try {
        clearInterval(wakePoll); wakePoll = null; hosting = true;
        if (backPoll) { clearInterval(backPoll); backPoll = null; }
        if (room) { try { await room.leave(); } catch (x) {} room = null; }   /* a class this page had joined as a viewer */
        const opened = async (meetingId) => {
          await flipLive(s.no, true, 'rtk:' + meetingId);
          sessionNo = s.no; bindUrl(s.no); onAir(true); syncCtl();
          bnote.textContent = v2
            ? 'Your room is open. Check your camera below and press Enter Class — the recording starts when you’re in. Send students the link above. When you’re done, open Tools and press ' + ec.endButton + ' — Leave only leaves.'
            : 'Class is running. Press Join in the room below to go on camera — share screen, the participants list, and chat appear after that. Send students the link above; they join you here. When you’re done, press ' + ec.endButton + ' here — Leave only leaves.';
          /* the recording starts when the host is IN the room (the 'joined' state), not now: Cloudflare
             stops a recording that sits with nobody in it for 60 s, and the camera-check screen can
             easily take longer than that */
          pendingRecord = s.no;
          enableChat();
          await openChat();
        };
        if (v2) {
          await enterRoomV2({ session: s, mode: 'host', onOpened: opened });   /* resolves once the host is in */
        } else {
          const r = await enterRoom(s.no, null, sessLabel(s) + ' · ' + s.title);
          await opened(r.meetingId);
        }
        entering = false; leftNo = null; syncCtl();
      } catch (e) {
        entering = false; hosting = false; if (!liveSess) armWake();
        if (room) { try { await room.leave(); } catch (x) {} room = null; }
        classBtn.disabled = false; syncCtl();
        bnote.textContent = 'Could not start the class: ' + (e.message || e);
      }
    });
    /* End: two taps within 4 s — the ONLY thing on this page that ends the class for everyone. In the room the
       module removes everyone, leaves, and says 'ended' → closeClass; out of it (left, or a class left running
       from another device) the server removes everyone from the meeting and stops the recording (ea-rtk-record
       'end' — kick-all, never INACTIVE: a session keeps its meeting), then the row is closed from here. A function
       older than this page (no 'end' yet) answers bad_action: then stop, and the people in the room leave on their
       own within 20 s through their poll on the row. */
    goBtn.addEventListener('click', async () => {
      if (goBtn.dataset.armed !== '1') {
        goBtn.dataset.armed = '1'; goBtn.textContent = ec.endAsk + ' ' + ec.endAgain;
        setTimeout(() => { if (goBtn.dataset.armed === '1') { goBtn.dataset.armed = ''; goBtn.textContent = ec.endButton; } }, 4000);
        return;
      }
      goBtn.dataset.armed = ''; goBtn.disabled = true; goBtn.textContent = 'Ending…';
      if (room && room.end) { try { await room.end(); } catch (e) {} goBtn.disabled = false; goBtn.textContent = ec.endButton; return; }
      const no = cur().no;
      hosting = false; leftNo = null; pendingRecord = null; stopRecPoll();
      try { await record('end', no); }
      catch (e) { if (e && e.code === 'bad_action') { try { await record('stop', no); } catch (x) {} } }   /* everyone out + the recording stopped; an older function: stop only */
      recFor = null;
      try { await flipLive(no, false); }
      catch (e) { goBtn.disabled = false; goBtn.textContent = ec.endButton; syncCtl(); bnote.textContent = 'Could not end: ' + e.message; return; }
      location.reload();
    });
    sel.addEventListener('change', () => { syncCtl(); syncLink(); });
    syncCtl(); syncLink();
  }
}
</script>
</body></html>

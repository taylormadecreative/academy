<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Judging · Open Payments Innovation Lab</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#04123a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/build-mode.css?v=3b7d540f53">
<link rel="stylesheet" href="/opil/hub/hub.css?v=c11357f8a1">
<script>document.documentElement.classList.add('js')</script>
<style>
.jd{max-width:860px;margin-inline:auto}
.jcard{background:#fff;border:1px solid var(--hair);border-radius:16px;margin-bottom:16px;overflow:hidden}
.jcard summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;padding:18px 22px}
.jcard summary::-webkit-details-marker{display:none}
.jcard .tm{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.jcard .st2{margin-left:auto;font-size:12.5px;font-weight:600}
.jcard .bd2{padding:0 22px 22px}
.rub{display:grid;gap:12px;margin-top:6px}
.rub .cr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.rub .cr b{font-size:14px;color:var(--ink)}
.rub .pts{display:flex;gap:6px}
.rub .pts label{width:36px;height:36px;border:1.5px solid var(--hair);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.rub .pts input{position:absolute;opacity:0;pointer-events:none}
.rub .pts label:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
.jcard textarea{width:100%;font:inherit;font-size:14px;padding:11px 14px;border:1.5px solid var(--hair);border-radius:12px;min-height:70px;margin-top:12px}
.jcard .save{margin-top:12px;font:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--blue);border:0;border-radius:980px;padding:12px 26px;cursor:pointer}
.dvline{font-size:13.5px;color:var(--ink-2);padding:4px 0}
.dvline a{color:var(--blue);font-weight:600}
</style>
</head><body>
<header class="site-header"><div class="wrap"><div class="bar">
<a class="brand" href="/"><img class="logo" src="/assets/logo-nav.webp" alt="" width="40" height="40" decoding="async"><span class="mark">Taylormade Academy</span></a>
<div class="nav-cta"><span class="mono" style="color:var(--muted)">OPIL · JUDGING</span></div>
</div></div></header>

<main class="hub-wrap">
<div class="hub-head"><div><span class="kicker gold" id="evKick">Business Idea Pitch</span><h1 style="margin-top:10px">Score the teams.</h1></div>
<div style="display:flex;gap:8px">
<button class="pillbtn" id="evPitch">Pitch · Dec 4</button>
<button class="pillbtn" id="evShow" style="background:var(--bg-soft);color:var(--muted)">Showcase · Mar 19</button>
</div></div>
<div class="hub-tabs"></div>
<p style="font-size:14.5px;color:var(--muted);max-width:64ch;margin-bottom:26px">Four criteria, one to five. Your scores save per team and you can revise until the event closes. Comments go to the program team, not the students.</p>
<div class="jd" id="teams"><div class="empty">Loading&hellip;</div></div>
</main>

<script src="/js/config.js?v=3b7d540f53"></script>
<script type="module">
import { boot, esc, nav } from '/opil/hub/hub.js?v=c11357f8a1';
const ctx = await boot(); if (!ctx) throw new Error('gate');
const { sb, user, isJudge, isAdmin } = ctx;
if (!isJudge && !isAdmin) { location.replace('/opil/hub/'); throw new Error('not judge'); }
nav(ctx, 'judge');

const CRITERIA = [
  ['problem', 'Problem and customer: is it real, and do they know who pays?'],
  ['model', 'Business model: could this venture sustain itself?'],
  ['prototype', 'Prototype and payment flow: does the open-payments piece work?'],
  ['presentation', 'Presentation: clear, confident, credible'],
];
let EVENT = 'pitch';
const [{ data: teams }, { data: myScores }, { data: dvs }] = await Promise.all([
  sb.from('ea_opil_teams').select('*').order('name'),
  sb.from('ea_opil_scores').select('*').eq('judge_id', user.id),
  sb.from('ea_opil_deliverables').select('team_id,title,link_url,session_no').order('created_at', { ascending: false }),
]);
const scoreOf = (tid) => (myScores || []).find(s => s.team_id === tid && s.event === EVENT);
const dvOf = (tid) => (dvs || []).filter(d => d.team_id === tid).slice(0, 4);

function render() {
  document.getElementById('evKick').textContent = EVENT === 'pitch' ? 'Business Idea Pitch · Dec 4' : 'Final Showcase · Mar 19';
  document.getElementById('evPitch').style.cssText = EVENT === 'pitch' ? '' : 'background:var(--bg-soft);color:var(--muted)';
  document.getElementById('evShow').style.cssText = EVENT === 'showcase' ? '' : 'background:var(--bg-soft);color:var(--muted)';
  const el = document.getElementById('teams');
  el.innerHTML = (teams && teams.length) ? (teams || []).map(t => {
    const sc = scoreOf(t.id); const r = (sc && sc.rubric) || {};
    const total = CRITERIA.reduce((a, [k]) => a + (Number(r[k]) || 0), 0);
    const work = dvOf(t.id).map(d => `<div class="dvline">${esc(d.title)}${d.link_url ? ` · <a href="${esc(d.link_url)}" target="_blank" rel="noopener">open</a>` : ''}</div>`).join('') || '<div class="dvline" style="color:var(--muted)">No published work yet.</div>';
    return `<details class="jcard"${sc ? '' : ''}>
      <summary><span class="tm">${esc(t.name)}</span><span style="font-size:12.5px;color:var(--muted)">${esc(t.school || '')}</span>
      <span class="st2" style="color:${sc ? 'var(--emerald)' : 'var(--muted)'}">${sc ? 'Scored · ' + total + '/20' : 'Not scored'}</span></summary>
      <div class="bd2">
      <div style="font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Their work</div>${work}
      <form class="rub" data-team="${t.id}">
      ${CRITERIA.map(([k, label]) => `<div class="cr"><b>${label}</b><span class="pts">${[1,2,3,4,5].map(v => `<label><input type="radio" name="${k}" value="${v}" ${Number(r[k]) === v ? 'checked' : ''}><span>${v}</span></label>`).join('')}</span></div>`).join('')}
      <textarea name="comment" placeholder="Notes for the program team (optional)" maxlength="2000">${esc((sc && sc.comment) || '')}</textarea>
      <button class="save" type="submit">${sc ? 'Update scores' : 'Save scores'}</button>
      </form>
      </div></details>`;
  }).join('') : '<div class="empty">Teams appear as registration closes.</div>';
}
render();
document.getElementById('evPitch').addEventListener('click', () => { EVENT = 'pitch'; render(); });
document.getElementById('evShow').addEventListener('click', () => { EVENT = 'showcase'; render(); });
document.getElementById('teams').addEventListener('submit', async (ev) => {
  const f = ev.target.closest('.rub'); if (!f) return;
  ev.preventDefault();
  const rubric = {};
  CRITERIA.forEach(([k]) => { const v = f.querySelector(`input[name="${k}"]:checked`); if (v) rubric[k] = Number(v.value); });
  if (Object.keys(rubric).length < CRITERIA.length) { alert('Score all four criteria.'); return; }
  const btn = f.querySelector('.save'); btn.textContent = 'Saving…';
  const row = { judge_id: user.id, team_id: f.dataset.team, event: EVENT, rubric, comment: f.comment.value.trim() || null };
  const { error } = await sb.from('ea_opil_scores').upsert(row, { onConflict: 'judge_id,team_id,event' });
  if (error) { btn.textContent = 'Retry'; return; }
  const i = (myScores || []).findIndex(s => s.team_id === row.team_id && s.event === EVENT);
  if (i > -1) myScores[i] = row; else myScores.push(row);
  btn.textContent = 'Saved ✓'; setTimeout(render, 500);
});
</script>
</body></html>

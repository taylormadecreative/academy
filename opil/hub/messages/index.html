<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages · Lab Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#04123a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/build-mode.css?v=ab2e983f14">
<link rel="stylesheet" href="/opil/hub/hub.css?v=ab2e983f14">
<script>document.documentElement.classList.add('js')</script>
</head><body>
<header class="site-header"><div class="wrap"><div class="bar">
<a class="brand" href="/"><img class="logo" src="/assets/logo-nav.webp" alt="" width="40" height="40" decoding="async"><span class="mark">Taylormade Academy</span></a>
<div class="nav-cta"><span class="mono" style="color:var(--muted)">OPIL LAB HUB · 2026–27</span></div>
</div></div></header>

<main class="hub-wrap">
<div class="hub-head">
<div><span class="kicker gold">Direct messages</span><h1 style="margin-top:10px">Messages</h1></div>
</div>
<div class="hub-tabs"></div>

<div class="hub-grid dm">
<div class="hcard">
<div class="hd2"><h2>People</h2></div>
<div class="bd" id="people" style="max-height:560px;overflow-y:auto"><div class="empty">Loading&hellip;</div></div>
</div>
<div class="hcard chat">
<div class="hd2" style="display:block"><h2 id="threadTitle">Pick someone to message</h2><p id="threadSub" style="margin:4px 0 0;font-size:12.5px;color:var(--muted)"></p></div>
<div class="scroll" id="dmScroll"><div class="empty">Messages are private between the two of you.</div></div>
<form id="dmForm" style="display:none"><input id="dmInput" aria-label="Message" placeholder="Write a message" maxlength="4000" autocomplete="off"><button type="submit">Send</button></form>
<div id="dmMsg" role="status" aria-live="polite" style="font-size:13.5px;padding:0 16px 12px"></div>
</div>
</div>
</main>

<script src="/js/config.js?v=ab2e983f14"></script>
<script type="module">
import { boot, names, esc, when, nav } from '/opil/hub/hub.js?v=ab2e983f14';
import { directory, teamSentLine, teamIntro } from '/opil/hub/messages/directory.js?v=ab2e983f14';
const ctx = await boot(); if (!ctx) throw new Error('gate');
const { sb, user, isAdmin, facSessions } = ctx;
nav(ctx, 'messages');
/* the program team (admins + facilitators) can message a whole team at once (0057) */
const program = isAdmin || (facSessions || []).length > 0;

/* who is on which team: the program team reads it through ea_opil_roster_teams (facilitators can't read
   team_members directly); a student reads the cohort the way they always have */
let rows = [], staffPeople = [], rosterFailed = false;
if (program) {
  const { data, error } = await sb.rpc('ea_opil_roster_teams');
  if (error) { console.warn('[messages] roster', error); rosterFailed = true; }
  rows = data || [];
  if (isAdmin) {
    /* the roster leaves out the coordinator space (is_staff); an admin still messages fellow coordinators */
    const { data: st } = await sb.from('ea_opil_teams').select('id').eq('is_staff', true);
    const ids = (st || []).map(t => t.id);
    if (ids.length) {
      const { data: sm } = await sb.from('ea_opil_team_members').select('user_id').in('team_id', ids);
      staffPeople = (sm || []).map(m => ({ sender_id: m.user_id }));
    }
  }
} else {
  const { data: mems } = await sb.from('ea_opil_team_members').select('user_id, team_id');
  const teamIds = [...new Set((mems || []).map(m => m.team_id))];
  const { data: teams } = await sb.from('ea_opil_teams').select('id, name, is_staff').in('id', teamIds.length ? teamIds : ['00000000-0000-0000-0000-000000000000']);
  const tn = {}; (teams || []).forEach(t => { if (!t.is_staff) tn[t.id] = t.name; });
  rows = (mems || []).filter(m => tn[m.team_id]).map(m => ({ user_id: m.user_id, team_name: tn[m.team_id] }));
  /* the coordinator space (is_staff) is the program team, not a student team */
  const staffIds = new Set((teams || []).filter(t => t.is_staff).map(t => t.id));
  staffPeople = (mems || []).filter(m => staffIds.has(m.team_id)).map(m => ({ sender_id: m.user_id }));
}
/* anyone I've messaged with who is on no team = the program team; a student answers them from here */
const { data: partners } = await sb.from('ea_opil_dms').select('sender_id, recipient_id')
  .or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`).order('created_at', { ascending: false }).limit(500);
const dir = directory(rows, [...staffPeople, ...(partners || [])], user.id);
const everyone = [...dir.teams.flatMap(t => t.uids), ...dir.program];
const nm = await names(sb, everyone);
const teamOf = {}; dir.teams.forEach(t => t.uids.forEach(u => { teamOf[u] = t.name; }));

const peopleEl = document.getElementById('people');
let to = null, teamTo = null;   /* declared before the first paint: paintPeople() marks the open conversation */
const person = (uid, sub) => `<button type="button" class="member" data-uid="${esc(uid)}" style="width:100%;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;cursor:pointer;min-height:54px"><span class="av" aria-hidden="true">${esc((nm[uid] || 'M')[0])}</span>
   <div><b>${esc(nm[uid] || 'Member')}</b><span>${esc(sub)}</span></div></button>`;
const groupHead = (label, btn) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px;min-height:40px">
   <h3 style="margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">${esc(label)}</h3>${btn || ''}</div>`;
function paintPeople() {
  let html = '';
  if (dir.program.length) html += groupHead('Program team · coordinators and facilitators') + dir.program.map(u => person(u, 'Program team')).join('');
  html += dir.teams.map((t, i) => groupHead(t.name, program && t.name !== 'No team yet'
      ? `<button type="button" class="pillbtn" data-team="${i}" aria-label="Message the whole team, ${esc(t.name)}" style="padding:8px 14px;font-size:12px;min-height:40px">Message the whole team</button>` : '')
    + t.uids.map(u => person(u, t.name)).join('')).join('');
  peopleEl.innerHTML = rosterFailed && !html
    ? '<div class="empty">Could not load the cohort. Reload the page to try again.</div>'
    : (html || '<div class="empty">As teams register, the whole cohort appears here.</div>');
  markCurrent();
}
paintPeople();

const scroll = document.getElementById('dmScroll');
const form = document.getElementById('dmForm');
const input = document.getElementById('dmInput');
const sendBtn = form.querySelector('button[type="submit"]');
const dmMsg = document.getElementById('dmMsg');
const sub = document.getElementById('threadSub');
const say = (t, tone) => { dmMsg.textContent = t || ''; dmMsg.style.color = tone === 'good' ? '#067a56' : '#b42318'; dmMsg.style.fontWeight = tone === 'good' ? '600' : '400'; };
function markCurrent() {
  peopleEl.querySelectorAll('[data-uid]').forEach(b => { if (b.dataset.uid === to) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
}

async function loadThread() {
  if (!to) return;
  const req = to;
  const { data: msgs } = await sb.from('ea_opil_dms').select('*')
    .or(`and(sender_id.eq.${user.id},recipient_id.eq.${to}),and(sender_id.eq.${to},recipient_id.eq.${user.id})`)
    .order('created_at', { ascending: false }).limit(300);
  if (msgs) msgs.reverse();
  if (req !== to) return;
  const nearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
  scroll.innerHTML = (msgs && msgs.length)
    ? msgs.map(m => `<div class="bub${m.sender_id === user.id ? ' me' : ''}"><p>${esc(m.body)}</p><div class="w">${when(m.created_at)}</div></div>`).join('')
    : '<div class="empty">Start the conversation.</div>';
  if (nearBottom) scroll.scrollTop = scroll.scrollHeight;
  /* mark received as read — only when this batch actually holds something unread,
     so an idle open thread is not a PATCH on every poll */
  if ((msgs || []).some(m => m.recipient_id === user.id && !m.read_at))
    sb.from('ea_opil_dms').update({ read_at: new Date().toISOString() })
      .eq('recipient_id', user.id).eq('sender_id', to).is('read_at', null).then(() => {});
}
function openThread(uid) {
  to = uid; teamTo = null; say('');
  document.getElementById('threadTitle').textContent = nm[uid] || 'Member';
  sub.textContent = `Only you and ${nm[uid] || 'this person'} can see this conversation.`;
  input.placeholder = 'Write a message';
  form.style.display = '';
  markCurrent();
  loadThread();
  input.focus();
}
function openTeam(t) {
  to = null; teamTo = t; say('');
  document.getElementById('threadTitle').textContent = 'Message the whole team: ' + t.name;
  sub.textContent = '';
  markCurrent();
  scroll.innerHTML = `<div class="empty">${esc(teamIntro(t.name, t.uids.length))}</div>`;
  input.placeholder = 'Write to everyone on ' + t.name;
  form.style.display = '';
  input.focus();
}
peopleEl.addEventListener('click', (ev) => {
  const tb = ev.target.closest('[data-team]');
  if (tb) { const t = dir.teams[+tb.dataset.team]; if (t) openTeam(t); return; }
  const a = ev.target.closest('[data-uid]'); if (!a) return;
  openThread(a.dataset.uid);
});
let sending = false;
form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const body = input.value.trim(); if (!body || sending) return;
  if (!to && !teamTo) return;
  sending = true; sendBtn.disabled = true;
  const t = teamTo, who = to;
  const recips = t ? t.uids : [who];
  /* one insert, one row per person: all of them land or none do */
  const { error } = await sb.from('ea_opil_dms').insert(recips.map(r => ({ sender_id: user.id, recipient_id: r, body })));
  sending = false; sendBtn.disabled = false;
  const still = teamTo === t && to === who;   /* the person may have opened another conversation meanwhile */
  if (!still) return;
  if (error) { console.warn('[messages] send', error); say('Could not send. Nothing went out. Try again.'); input.focus(); return; }
  if (input.value.trim() === body) input.value = '';
  input.focus();
  if (t) {
    scroll.innerHTML = `<div class="bub me"><p>${esc(body)}</p><div class="w">just now</div></div>`;
    say(teamSentLine(t.name, recips.length), 'good');
  } else { say(''); loadThread(); }
});
try {
  sb.channel('dm-' + user.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ea_opil_dms', filter: 'recipient_id=eq.' + user.id }, (p) => {
      /* a first message from someone new (a facilitator writing a student) joins the list */
      const from = p && p.new && p.new.sender_id;
      if (from && !everyone.includes(from)) {
        dir.program.push(from); everyone.push(from);
        names(sb, [from]).then(m => { Object.assign(nm, m); paintPeople(); });
      }
      loadThread();
    })
    .subscribe();
} catch (e) {}
setInterval(loadThread, 15000);

/* deep link ?to=uid (from team roster) */
const want = new URLSearchParams(location.search).get('to');
if (want && everyone.includes(want)) openThread(want);
</script>
</body></html>
